[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsystem-bc-launcher"
version = "0.3.40"
description = "BC container management tool for the shopsystem framework"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bc-container = "bc_launcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
