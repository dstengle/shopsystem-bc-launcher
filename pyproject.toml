[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shopsystem-bc-launcher"
version = "0.3.68"
description = "BC container management tool for the shopsystem framework"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bc-container = "bc_launcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# lead-ona9 (scenario 7700eea079ffe1d8): the self-contained fabro loop def
# bundle is NO LONGER shipped as package-data / baked into the wheel.  It is
# delivered at launch by the shop-templates POUR, which emits
# "/workspace/.fabro/" exactly as it emits ".claude/skills/" — so the wheel is
# no longer a baked delivery surface for the def.  The def files under
# src/bc_launcher/assets/fabro-def/ REMAIN in the repo as the def SOURCE mirror
# (read by the content-validity pins and the fabro-path workflow.toml rewrite),
# but are intentionally NOT enumerated here, so they do not travel in the wheel.

[tool.pytest.ini_options]
testpaths = ["tests"]
