# Rebuild the shopsystem-bc-base image on an inbound repository_dispatch event.
#
# Pins scenario 38 (4e470f7584650a2d) declaratively: a repository_dispatch
# trigger whose job rebuilds docker/bc-base/Dockerfile (picking up the current
# framework utility versions) and re-pushes the "latest" tag at the freshly
# built digest.
#
# Also pins scenarios 365be56194c892b9 + edd2c813688ab768 (lead-aw1b /
# lead-pwa2): a shopsystem-templates RELEASE emits a repository_dispatch whose
# event_type is the literal "shopsystem-templates-released" (the exact literal
# POSTed by dstengle/shopsystem-templates .github/workflows/release.yml),
# carrying the released tag in client_payload.tag. For a real release dispatch
# to start a run, this workflow MUST subscribe to that same literal; a
# mismatched subscription is a silent no-op. This run consumes that released
# tag from github.event.client_payload.tag and threads it into the image build
# as the SHOP_TEMPLATES_VERSION build-arg, so the republished "latest" carries
# the RELEASED shop-templates version rather than the previously hard-pinned
# one. A plain "rebuild-bc-base" dispatch with no client_payload.tag falls back
# to the Dockerfile's default pin.
name: rebuild-bc-base

on:
  repository_dispatch:
    types:
      # Manual / plain rebuild dispatch (no released tag in client_payload).
      - rebuild-bc-base
      # The exact event_type literal POSTed by the shopsystem-templates release
      # workflow (release.yml). Must equal the producer literal for a real
      # templates-release dispatch to start a rebuild run.
      - shopsystem-templates-released

permissions:
  contents: read
  packages: write

jobs:
  rebuild-and-republish-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the bc-launcher repository
        uses: actions/checkout@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild bc-base and re-push latest at the new digest
        uses: docker/build-push-action@v6
        with:
          context: ./docker/bc-base
          file: ./docker/bc-base/Dockerfile
          push: true
          # Re-push "latest" so a repository_dispatch produces a new digest
          # (D_new) pointed at by "latest", distinct from the prior D_old.
          no-cache: true
          # Thread the RELEASED shop-templates tag from the dispatch
          # client_payload into the image build (lead-pwa2). A templates-release
          # dispatch sets client_payload.tag to the released tag; an empty value
          # (a plain rebuild dispatch) leaves SHOP_TEMPLATES_VERSION unset so the
          # Dockerfile's default pin applies.
          build-args: |
            SHOP_TEMPLATES_VERSION=${{ github.event.client_payload.tag }}
          tags: |
            ghcr.io/dstengle/shopsystem-bc-base:latest
