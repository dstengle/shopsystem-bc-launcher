# Centralized scheduled bc-base dependency check-bump-rebuild (lead-czwo,
# ADR-022).
#
# This is the SINGLE workflow that runs the bc-base check-bump-rebuild cycle.
# It REPLACES the per-repo repository_dispatch fan-in (the retired scenarios
# 365be56194c892b9 + edd2c813688ab768): no inbound cross-repo
# repository_dispatch is required to start the cycle.
#
# Pins, declaratively (scenario-40 declarative-artifact precedent — live
# Actions / live registry state is OUT-OF-BAND, the committed YAML is the
# proxy):
#   - 930a6a6579e2a859: exactly ONE workflow runs the cycle; it is triggered by
#     a cron schedule (recurring, no external event); it handles ALL baked
#     dependencies in one workflow (not one-per-dep).
#   - 0f386f31857fbeb1: the poll resolves each baked dependency's latest release
#     tag against its canonical repo using the workflow's OWN GITHUB_TOKEN (NOT
#     a BC_LAUNCHER_DISPATCH_TOKEN or any cross-repo dispatch credential); the
#     resolved latest tag is compared against the current Dockerfile pin.
#   - 5b6a931a493971a6: when a dep's latest > Dockerfile pin, FIRST bump the
#     pin in docker/bc-base/Dockerfile, THEN build, THEN republish :latest.
#   - cf8625dbac93cfdc: when every dep's latest == its pin, make no change /
#     run no build / republish nothing.
#   - 59c0f539187eabbb: workflow_dispatch lets an operator start the SAME path.
#   - 2b69c3b682f7871d: the bumped Dockerfile is COMMITTED back to the repo
#     recording the triggering dep version; the build is not from an
#     uncommitted working-tree-only edit.
#   - 69904daef7a8d13e: after the poll propagates a newer release, bc-base:latest
#     carries the new version.
name: poll-bc-base-deps

on:
  # Recurring schedule — the check-bump-rebuild cycle runs without any external
  # event (930a6a6579e2a859). Daily at 07:00 UTC.
  schedule:
    - cron: "0 7 * * *"
  # Operator manual start of the SAME path (59c0f539187eabbb): no source change,
  # no raw `gh api .../dispatches` call.
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  # ONE job that checks ALL baked dependencies, bumps the Dockerfile pin(s) when
  # any is newer, commits the bump, then rebuilds + republishes :latest. There
  # is no per-dependency workflow and no repository_dispatch trigger.
  check-bump-rebuild:
    runs-on: ubuntu-latest
    env:
      DOCKERFILE: docker/bc-base/Dockerfile
      # The poll uses bc-launcher's OWN GITHUB_TOKEN to read the public
      # canonical-repo releases (0f386f31857fbeb1). It does NOT use a
      # BC_LAUNCHER_DISPATCH_TOKEN or any cross-repo dispatch credential.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the bc-launcher repository
        uses: actions/checkout@v4

      - name: Resolve each baked dependency's latest release and bump stale pins
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # All baked dependencies in ONE workflow (930a6a6579e2a859):
          # "<dep-key>|<canonical owner/repo>". The canonical repos
          # (0f386f31857fbeb1):
          #   shop-templates       -> dstengle/shopsystem-templates
          #   shop-msg             -> dstengle/shopsystem-messaging
          #   scenarios            -> dstengle/shopsystem-scenarios
          #   beads                -> steveyegge/beads
          #   fabro                -> fabro-sh/fabro
          #   shopsystem-bc-launcher -> dstengle/shopsystem-bc-launcher
          # The shopsystem-bc-launcher entry is the bc-base SELF-PIN
          # (493bbbb7dcb61d7e/e28886c34b0d4c65): the bc-base Dockerfile pins
          # bc-launcher's OWN code via a VCS pin; the poll resolves
          # bc-launcher's own latest release from its canonical repo with the
          # workflow's OWN GITHUB_TOKEN (NOT a BC_LAUNCHER_DISPATCH_TOKEN or any
          # cross-repo dispatch credential) and bumps the self-pin like the
          # other baked deps. This entry MUST live in the executable DEPS array
          # below, not merely in this comment, to be polled.
          DEPS=(
            "shop-templates|dstengle/shopsystem-templates"
            "shop-msg|dstengle/shopsystem-messaging"
            "scenarios|dstengle/shopsystem-scenarios"
            "beads|steveyegge/beads"
            "fabro|fabro-sh/fabro"
            "shopsystem-bc-launcher|dstengle/shopsystem-bc-launcher"
          )

          changed="false"

          for entry in "${DEPS[@]}"; do
            dep="${entry%%|*}"
            repo="${entry##*|}"

            # Resolve this dependency's latest published release as the
            # SEMVER-MAXIMUM release tag (lead-bss3, 9620473690f7ecb5) using the
            # workflow's OWN GITHUB_TOKEN against the canonical repo's public
            # releases (0f386f31857fbeb1, no BC_LAUNCHER_DISPATCH_TOKEN). We
            # LIST every published release, keep only well-formed semver tags,
            # version-sort them (sort -V) and take the MAX -- NOT an arbitrary
            # or first release-list entry. The lookup is GUARDED (2>/dev/null,
            # || true): a missing/malformed result for ONE dependency is skipped
            # with a ::warning:: and the remaining baked deps are still checked,
            # rather than a hard exit that aborts the whole poll under
            # `set -euo pipefail`.
            latest="$(GH_TOKEN="${GITHUB_TOKEN}" gh release list \
              --repo "${repo}" --json tagName --jq '.[].tagName' 2>/dev/null \
              | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -n1 || true)"
            if [ -z "${latest}" ]; then
              echo "::warning::could not resolve a latest published release for ${dep} (${repo}); skipping this dependency and continuing the poll"
              continue
            fi
            echo "resolved latest for ${dep} (${repo}): ${latest}"

            # The CURRENT pin in docker/bc-base/Dockerfile for this dependency.
            case "${dep}" in
              shop-templates)
                current="$(grep -oP 'ARG SHOP_TEMPLATES_VERSION=\Kv[0-9]+\.[0-9]+\.[0-9]+' "${DOCKERFILE}" || true)"
                ;;
              shop-msg)
                current="$(grep -oP 'shopsystem-messaging(?:\.git)?@\Kv[0-9]+\.[0-9]+\.[0-9]+' "${DOCKERFILE}" || true)"
                ;;
              scenarios)
                current="$(grep -oP 'shopsystem-scenarios(?:\.git)?@\Kv[0-9]+\.[0-9]+\.[0-9]+' "${DOCKERFILE}" || true)"
                ;;
              beads)
                current="$(grep -oP 'BD_VERSION=\K[0-9]+\.[0-9]+\.[0-9]+' "${DOCKERFILE}" || true)"
                ;;
              fabro)
                # fabro is baked as a binary from fabro-sh/fabro pinned through
                # the ARG FABRO_VERSION default; the poll bumps that ARG in
                # place (lead-ckq5).
                current="$(grep -oP 'ARG FABRO_VERSION=\Kv[0-9]+\.[0-9]+\.[0-9]+' "${DOCKERFILE}" || true)"
                ;;
              shopsystem-bc-launcher)
                # The bc-base SELF-PIN: bc-launcher pins its OWN code via a VCS
                # pin distinct from the framework-CLI pins
                # (493bbbb7dcb61d7e):
                #   shopsystem-bc-launcher @ git+https://github.com/dstengle/shopsystem-bc-launcher.git@vX.Y.Z
                current="$(grep -oP 'shopsystem-bc-launcher(?:\.git)?@\Kv[0-9]+\.[0-9]+\.[0-9]+' "${DOCKERFILE}" || true)"
                ;;
            esac
            echo "current pin for ${dep}: ${current}"

            # Compare the RESOLVED latest against the current Dockerfile pin
            # under SEMVER (0f386f31857fbeb1). beads pins a bare version;
            # normalize the leading "v" for comparison only.
            latest_norm="${latest#v}"
            current_norm="${current#v}"
            if [ -z "${current_norm}" ]; then
              echo "::warning::could not read the current ${dep} pin from ${DOCKERFILE}; skipping this dependency and continuing the poll"
              continue
            fi

            # Only a STRICTLY-FORWARD latest bumps (9620473690f7ecb5): take the
            # semver-MAX of {current pin, resolved latest} via sort -V. If latest
            # equals the pin, OR latest is BEHIND the pin (the max resolves back
            # to the current pin), this is a NO-OP -- the pin is NOT rewritten
            # DOWN to the lower version and the job does NOT exit non-zero. A
            # behind resolution (e.g. resolved v0.45.0 vs pin v0.48.0) is a
            # no-bump result, never a "release not found" hard error.
            max="$(printf '%s\n%s\n' "${current_norm}" "${latest_norm}" | sort -V | tail -n1)"
            if [ "${latest_norm}" = "${current_norm}" ] || [ "${max}" = "${current_norm}" ]; then
              echo "no bump for ${dep}: resolved latest ${latest} is not strictly greater than current pin ${current}"
              continue
            fi

            # latest is STRICTLY GREATER than the current pin -> FIRST mutate the
            # Dockerfile so the pin reads the new tag (5b6a931a493971a6). The
            # bump happens BEFORE any build below.
            echo "bumping ${dep}: ${current} -> ${latest}"
            case "${dep}" in
              shop-templates)
                sed -i -E "s|(ARG SHOP_TEMPLATES_VERSION=)v[0-9]+\.[0-9]+\.[0-9]+|\1${latest}|" "${DOCKERFILE}"
                ;;
              shop-msg)
                sed -i -E "s|(shopsystem-messaging(\.git)?@)v[0-9]+\.[0-9]+\.[0-9]+|\1${latest}|" "${DOCKERFILE}"
                ;;
              scenarios)
                sed -i -E "s|(shopsystem-scenarios(\.git)?@)v[0-9]+\.[0-9]+\.[0-9]+|\1${latest}|" "${DOCKERFILE}"
                ;;
              beads)
                sed -i -E "s|(BD_VERSION=)[0-9]+\.[0-9]+\.[0-9]+|\1${latest_norm}|" "${DOCKERFILE}"
                ;;
              fabro)
                # Bump the FABRO_VERSION ARG default in place to the resolved
                # latest fabro-sh/fabro tag (lead-ckq5).
                sed -i -E "s|(ARG FABRO_VERSION=)v[0-9]+\.[0-9]+\.[0-9]+|\1${latest}|" "${DOCKERFILE}"
                ;;
              shopsystem-bc-launcher)
                # Bump the bc-base SELF-PIN VCS line in place
                # (493bbbb7dcb61d7e); target the bc-launcher VCS-pin format
                # specifically so the framework-CLI pins are untouched.
                sed -i -E "s|(shopsystem-bc-launcher(\.git)?@)v[0-9]+\.[0-9]+\.[0-9]+|\1${latest}|" "${DOCKERFILE}"
                ;;
            esac
            changed="true"
          done

          echo "changed=${changed}" >> "${GITHUB_OUTPUT}"

      - name: Commit the bumped Dockerfile recording the new dependency versions
        # Only when a pin was bumped (cf8625dbac93cfdc: no-op makes no commit).
        # The bumped Dockerfile is COMMITTED back to the repo BEFORE the build
        # so the republished :latest is built from a committed pin, not an
        # uncommitted working-tree-only edit (2b69c3b682f7871d).
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${DOCKERFILE}"
          git commit -m "chore(bc-base): bump baked dependency pin(s) to latest release

          Centralized scheduled poll (poll-bc-base-deps.yml) detected a newer
          canonical release for one or more baked dependencies and bumped the
          ${DOCKERFILE} pin(s) to record the triggering dependency version(s)."
          git push

      - name: Log in to ghcr.io
        if: steps.bump.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild bc-base from the bumped Dockerfile and republish :latest
        # Runs ONLY after the pin is bumped AND committed (5b6a931a493971a6
        # ordering; 2b69c3b682f7871d commit-before-build). On a no-op run this
        # step is skipped, so no build runs and :latest is not republished
        # (cf8625dbac93cfdc).
        if: steps.bump.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./docker/bc-base
          file: ./docker/bc-base/Dockerfile
          push: true
          no-cache: true
          # Republish :latest at the new digest built from the bumped Dockerfile
          # (5b6a931a493971a6 / 69904daef7a8d13e).
          tags: |
            ghcr.io/dstengle/shopsystem-bc-base:latest
